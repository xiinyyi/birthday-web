<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Annyeong ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Gaegu:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    min-height: 100vh;
    overflow-x: hidden;
    font-family: 'Gaegu', cursive;
  }

  /* Touch: restore default cursor */
  @media (hover: none) {
    body { cursor: auto; }
    .cursor, .cursor-trail { display: none !important; }
  }
  @media (hover: hover) { body { cursor: none; } }

  /* ── Custom cursor (desktop) ── */
  .cursor {
    position: fixed; width: 22px; height: 22px;
    background: radial-gradient(circle, #ffb6c9, #e8849a);
    border-radius: 50%; pointer-events: none; z-index: 9999;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 12px #f4a7b9, 0 0 24px #fce4ec;
  }
  .cursor-trail {
    position: fixed; width: 9px; height: 9px;
    background: #f4a7b9; border-radius: 50%;
    pointer-events: none; z-index: 9998;
    transform: translate(-50%, -50%);
    opacity: 0.55;
    transition: left 0.12s ease, top 0.12s ease;
  }

  /* ── Background ── */
  .bg {
    position: fixed; inset: 0;
    background: url('img/bg1.jpeg') center top / cover no-repeat;
    z-index: 0;
    filter: brightness(0.35) saturate(1.2);
    transform: scale(1.05);
    animation: bgBreath 9s ease-in-out infinite;
  }
  @keyframes bgBreath {
    0%, 100% { transform: scale(1.05); }
    50%       { transform: scale(1.09); }
  }

  /* ── Gradient overlay for depth & contrast ── */
  .overlay {
    position: fixed; inset: 0;
    background: linear-gradient(
      170deg,
      rgba(80, 10, 45, 0.60) 0%,
      rgba(170, 50, 90, 0.35) 45%,
      rgba(210, 100, 130, 0.22) 70%,
      rgba(80, 10, 45, 0.68) 100%
    );
    z-index: 1;
  }

  /* ── Particles ── */
  .particles { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
  .petal { position: absolute; animation: fallPetal linear infinite; opacity: 0; }
  @keyframes fallPetal {
    0%   { transform: translateY(-30px) rotate(0deg) translateX(0); opacity: 0; }
    8%   { opacity: 0.85; }
    92%  { opacity: 0.6; }
    100% { transform: translateY(110vh) rotate(720deg) translateX(50px); opacity: 0; }
  }
  .float-heart { position: absolute; animation: floatUp ease-in infinite; opacity: 0; pointer-events: none; }
  @keyframes floatUp {
    0%   { transform: translateY(0) scale(0.5); opacity: 0; }
    18%  { opacity: 1; }
    82%  { opacity: 0.5; }
    100% { transform: translateY(-85vh) scale(1.1) rotate(12deg); opacity: 0; }
  }

  /* ── Glitter canvas ── */
  .glitter-canvas { position: fixed; inset: 0; z-index: 3; pointer-events: none; }

  /* ── Page layout ── */
  .content {
    position: relative; z-index: 10;
    width: 100%; min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 60px 20px 80px;
  }

  /* ── Top badge ── */
  .badge {
    background: rgba(255,255,255,0.14);
    border: 1.5px solid rgba(255,182,201,0.65);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-radius: 50px;
    padding: 7px 20px;
    color: #ffe0ec;
    font-size: clamp(10px, 2.8vw, 13px);
    letter-spacing: 2.5px; text-transform: uppercase;
    margin-bottom: 22px;
    animation: fadeInDown 0.9s ease 0.3s both;
    white-space: nowrap;
  }
  @keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Text card — the key to readable text ── */
  .text-card {
    background: rgba(50, 5, 22, 0.52);
    border: 1px solid rgba(255, 182, 201, 0.28);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border-radius: 28px;
    padding: clamp(26px, 5vw, 48px) clamp(28px, 7vw, 64px);
    text-align: center;
    max-width: 700px; width: 100%;
    box-shadow:
      0 10px 50px rgba(170, 50, 90, 0.4),
      0 2px 14px rgba(0,0,0,0.35),
      inset 0 1px 0 rgba(255,255,255,0.08);
    animation: fadeInUp 0.9s ease 0.5s both;
  }

  /* ── Greeting line 1 ── */
  .greeting-line1 {
    font-family: 'Nanum Myeongjo', serif;
    font-weight: 800;
    /* Fluid size capped at 2.6rem so text never forces a line break on laptop */
    font-size: clamp(1.4rem, 4.5vw, 2.6rem);
    color: #ffffff;
    letter-spacing: -0.5px; line-height: 1.15;
    display: block;
    white-space: nowrap;          /* always one line */
    text-shadow:
      0 0 18px rgba(255, 160, 190, 1),
      0 0 50px rgba(232, 132, 154, 0.9),
      0 2px 8px rgba(0,0,0,0.8);
    animation: fadeInUp 0.9s ease 0.7s both;
  }

  /* ── Greeting line 2 ── */
  .greeting-line2 {
    font-family: 'Gaegu', cursive;
    font-weight: 700;
    font-size: clamp(1.05rem, 3.8vw, 1.5rem);
    color: #ffd6e4;
    letter-spacing: 0.4px; line-height: 1.7;
    display: block; margin-top: 10px;
    text-shadow:
      0 1px 10px rgba(0,0,0,0.85),
      0 0 22px rgba(170, 50, 90, 0.7);
    animation: fadeInUp 0.9s ease 1s both;
  }
  .dots {
    display: inline-block;
    color: #ffb6c9;
    animation: dotPulse 1.6s ease-in-out infinite;
  }
  @keyframes dotPulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.25; }
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(28px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Heart divider ── */
  .heart-divider {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    width: 100%;                   /* stretch full card width so lines are even */
    margin: 20px 0 24px;
    animation: fadeIn 0.9s ease 1.3s both;
  }
  .heart-divider .line {
    flex: 1;                       /* equal flex so both lines are same length */
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,182,201,0.85), transparent);
  }
  .heart-divider .heart-center {
    font-size: 22px;
    animation: heartBeat 1.6s ease-in-out infinite;
    filter: drop-shadow(0 0 7px rgba(255,80,140,0.9));
  }
  @keyframes heartBeat {
    0%,100% { transform: scale(1);    }
    20%      { transform: scale(1.38); }
    40%      { transform: scale(1);    }
    60%      { transform: scale(1.2);  }
  }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

  /* ── CTA Button ── */
  .btn-wrapper {
    animation: fadeInUp 0.9s ease 1.5s both;
    position: relative; display: inline-block;
  }
  .btn-ring {
    position: absolute; inset: -7px; border-radius: 60px;
    border: 2px solid rgba(255,182,201,0.55);
    animation: ringPulse 2.2s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes ringPulse {
    0%,100% { transform: scale(1);    opacity: 0.7;  }
    50%      { transform: scale(1.07); opacity: 0.15; }
  }

  .btn-lets-see {
    position: relative; display: inline-flex; align-items: center; gap: 10px;
    padding: clamp(13px,3vw,17px) clamp(30px,7vw,50px);
    background: linear-gradient(135deg, #e8849a 0%, #bf4070 55%, #9e2458 100%);
    color: #fff;
    font-family: 'Nanum Myeongjo', serif;
    font-size: clamp(1rem, 3.5vw, 1.2rem);
    font-weight: 700; letter-spacing: 2px;
    text-decoration: none; border-radius: 50px; border: none;
    cursor: pointer; overflow: hidden;
    box-shadow:
      0 8px 32px rgba(190, 64, 112, 0.65),
      0 2px 10px rgba(0,0,0,0.35),
      inset 0 1px 0 rgba(255,255,255,0.28);
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s ease;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; white-space: nowrap;
  }
  .btn-lets-see::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.25) 0%, transparent 55%);
    border-radius: inherit; pointer-events: none;
  }
  /* Shimmer sweep */
  .btn-lets-see::after {
    content: ''; position: absolute;
    width: 55%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.38), transparent);
    top: 0; left: -80%;
    animation: shimmer 3.5s ease-in-out infinite 2.5s;
    pointer-events: none;
  }
  @keyframes shimmer { 0%{left:-80%;} 55%{left:130%;} 100%{left:130%;} }

  .btn-lets-see:hover, .btn-lets-see:focus {
    transform: translateY(-4px) scale(1.05);
    box-shadow:
      0 20px 55px rgba(190,64,112,0.8),
      0 4px 18px rgba(0,0,0,0.4),
      inset 0 1px 0 rgba(255,255,255,0.35);
    outline: none;
  }
  .btn-lets-see:active { transform: translateY(-1px) scale(1.01); }

  .btn-arrow { display: inline-block; animation: arrowBounce 1.3s ease-in-out infinite; }
  @keyframes arrowBounce { 0%,100%{transform:translateX(0);} 50%{transform:translateX(6px);} }

  /* ── Sound button ── */
  .sound-btn {
    position: fixed; bottom: 20px; right: 20px; z-index: 100;
    background: rgba(50,5,22,0.6);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1.5px solid rgba(255,182,201,0.5);
    border-radius: 50%; width: 50px; height: 50px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 22px;
    transition: transform 0.2s ease, background 0.2s ease;
    animation: fadeIn 1s ease 2s both;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .sound-btn:hover  { transform: scale(1.12); background: rgba(190,64,112,0.5); }
  .sound-btn:active { transform: scale(0.95); }

  /* ── Floral footer ── */
  .floral-bottom {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    font-size: clamp(16px, 4vw, 24px);
    z-index: 5; letter-spacing: 5px; opacity: 0.5;
    animation: floralSway 5s ease-in-out infinite;
    padding-bottom: 5px; pointer-events: none; white-space: nowrap;
  }
  @keyframes floralSway {
    0%,100% { letter-spacing: 5px;  opacity: 0.4; }
    50%      { letter-spacing: 10px; opacity: 0.65; }
  }

  /* ── Ripple ── */
  .ripple {
    position: fixed; border-radius: 50%;
    border: 2px solid rgba(255,182,201,0.85);
    transform: scale(0);
    animation: rippleOut 0.7s ease-out forwards;
    pointer-events: none; z-index: 9997;
  }
  @keyframes rippleOut { to { transform: scale(7); opacity: 0; } }

  /* ── Responsive ── */
  @media (max-width: 480px) {
    .content { padding: 50px 14px 70px; }
    .text-card { padding: 22px 18px; border-radius: 20px; }
    .badge { padding: 6px 13px; letter-spacing: 1.5px; }
    /* On very small phones allow the title to wrap rather than overflow */
    .greeting-line1 { white-space: normal; font-size: clamp(1.3rem, 6vw, 1.9rem); }
  }
  @media (max-height: 600px) and (orientation: landscape) {
    .content { padding: 20px 24px 60px; }
    .text-card { padding: 16px 30px; }
    .badge { margin-bottom: 12px; }
    .heart-divider { margin: 12px 0 16px; }
    .greeting-line1 { font-size: clamp(1.4rem, 5vw, 2.6rem); }
    .greeting-line2 { font-size: clamp(0.9rem, 3vw, 1.15rem); }
  }
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="cursor-trail" id="cursorTrail"></div>

<div class="bg"></div>
<div class="overlay"></div>
<canvas class="glitter-canvas" id="glitterCanvas"></canvas>
<div class="particles" id="particles"></div>

<main class="content">
  <div class="badge">✦ special delivery just for you ✦</div>

  <div class="text-card">
    <span class="greeting-line1">annyeonghaseoyo sis 🌸</span>
    <span class="greeting-line2">have some virtual present for you<span class="dots">.....</span></span>

    <div class="heart-divider">
      <div class="line"></div>
      <div class="heart-center">💖</div>
      <div class="line"></div>
    </div>

    <div class="btn-wrapper">
      <div class="btn-ring"></div>
      <a href="page2.html" class="btn-lets-see">
        Let's see ✨ <span class="btn-arrow">→</span>
      </a>
    </div>
  </div>
</main>

<div class="floral-bottom">🌸 🌷 🌸 🌷 🌸</div>
<button class="sound-btn" id="soundBtn" aria-label="Toggle Music">🎵</button>

<script>
// ── Cursor ──────────────────────────────────────────────────────────
const cursor = document.getElementById('cursor');
const trail  = document.getElementById('cursorTrail');
const isTouch = window.matchMedia('(hover: none)').matches;

if (!isTouch) {
  document.addEventListener('mousemove', e => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top  = e.clientY + 'px';
    setTimeout(() => {
      trail.style.left = e.clientX + 'px';
      trail.style.top  = e.clientY + 'px';
    }, 90);
    if (Math.random() < 0.05) spawnFloatEmoji(e.clientX, e.clientY, false);
  });
}

// ── Ripple + emoji on click/tap ─────────────────────────────────────
function doRipple(x, y) {
  const r = document.createElement('div');
  r.className = 'ripple';
  r.style.cssText = `left:${x-20}px;top:${y-20}px;width:40px;height:40px`;
  document.body.appendChild(r);
  setTimeout(() => r.remove(), 750);
}
document.addEventListener('click', e => {
  doRipple(e.clientX, e.clientY);
  spawnFloatEmoji(e.clientX, e.clientY, true);
});
document.addEventListener('touchstart', e => {
  const t = e.touches[0];
  spawnFloatEmoji(t.clientX, t.clientY, true);
}, { passive: true });

function spawnFloatEmoji(x, y, big) {
  const el  = document.createElement('div');
  const set = ['💗','💕','🌸','✨','💫','⭐','🎀','💝','🩷'];
  el.style.cssText = `
    position:fixed;left:${x}px;top:${y}px;
    font-size:${big ? 24 : 15}px;pointer-events:none;
    z-index:9996;animation:floatUp ${big ? 1.3 : 1}s ease forwards;
    transform:translate(-50%,-50%);`;
  el.textContent = set[Math.floor(Math.random() * set.length)];
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1400);
}

// ── Petals ──────────────────────────────────────────────────────────
const particles = document.getElementById('particles');
const emojiSet  = ['🌸','🌺','🌷','✨','💕','💗','🎀','⭐','🌹','💫'];
function spawnPetal() {
  const p = document.createElement('div');
  p.className = 'petal';
  p.textContent = emojiSet[Math.floor(Math.random() * emojiSet.length)];
  const dur = 7 + Math.random() * 8, del = Math.random() * 3;
  p.style.cssText = `left:${Math.random()*100}%;font-size:${13+Math.random()*16}px;animation-duration:${dur}s;animation-delay:${del}s;`;
  particles.appendChild(p);
  setTimeout(() => p.remove(), (dur + del) * 1000 + 500);
}
for (let i = 0; i < 20; i++) spawnPetal();
setInterval(spawnPetal, 700);

function spawnHeart() {
  const h = document.createElement('div');
  h.className = 'float-heart';
  const hset = ['💗','💕','💖','💝','🩷'];
  h.textContent = hset[Math.floor(Math.random() * hset.length)];
  const x = Math.random() < 0.5 ? Math.random()*12 : 88+Math.random()*12;
  const dur = 6 + Math.random() * 5, del = Math.random() * 3;
  h.style.cssText = `left:${x}%;bottom:0;animation-duration:${dur}s;animation-delay:${del}s;font-size:${14+Math.random()*10}px;filter:drop-shadow(0 0 4px rgba(255,100,150,0.6));`;
  particles.appendChild(h);
  setTimeout(() => h.remove(), (dur + del) * 1000 + 500);
}
for (let i = 0; i < 8; i++) spawnHeart();
setInterval(spawnHeart, 1100);

// ── Glitter canvas ──────────────────────────────────────────────────
const canvas = document.getElementById('glitterCanvas');
const ctx    = canvas.getContext('2d');
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize(); window.addEventListener('resize', resize);

const sparkles = Array.from({ length: 55 }, () => ({
  x: Math.random() * canvas.width, y: Math.random() * canvas.height,
  r: 1 + Math.random() * 2.5, a: Math.random() * Math.PI * 2,
  op: Math.random(),
  dir: (0.01 + Math.random() * 0.04) * (Math.random() < 0.5 ? 1 : -1),
  color: ['#ffb6c9','#f4a7b9','#f5c842','#ffffff','#fce4ec'][Math.floor(Math.random() * 5)]
}));

function drawSparkles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  sparkles.forEach(s => {
    s.op += s.dir;
    if (s.op > 1 || s.op < 0) s.dir *= -1;
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, s.op));
    ctx.fillStyle = s.color; ctx.shadowBlur = 10; ctx.shadowColor = s.color;
    ctx.beginPath();
    const r = s.r, ir = r * 0.38;
    for (let i = 0; i < 8; i++) {
      const ang = (i * Math.PI) / 4 + s.a, rad = i % 2 === 0 ? r : ir;
      i === 0 ? ctx.moveTo(s.x + rad * Math.cos(ang), s.y + rad * Math.sin(ang))
              : ctx.lineTo(s.x + rad * Math.cos(ang), s.y + rad * Math.sin(ang));
    }
    ctx.closePath(); ctx.fill(); ctx.restore();
    s.a += 0.012; s.x += Math.sin(s.a) * 0.25; s.y += 0.18;
    if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; }
  });
  requestAnimationFrame(drawSparkles);
}
drawSparkles();

// ── Romantic audio ──────────────────────────────────────────────────
let audioCtx, gainNode, isPlaying = false, intervals = null;
const soundBtn = document.getElementById('soundBtn');

function createRomanticSound() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  gainNode = audioCtx.createGain(); gainNode.gain.value = 0.09;
  gainNode.connect(audioCtx.destination);
  const conv = audioCtx.createConvolver();
  const rb   = audioCtx.createBuffer(2, audioCtx.sampleRate * 2.5, audioCtx.sampleRate);
  for (let c = 0; c < 2; c++) { const d = rb.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/d.length,2.5); }
  conv.buffer = rb; conv.connect(gainNode);
  const notes = [523.25,587.33,659.25,783.99,880,1046.5,987.77,880,783.99,659.25,587.33,523.25,466.16,523.25,587.33,659.25,783.99,659.25,523.25,440];
  const durs  = [0.5,0.5,1,0.5,0.5,1,0.5,0.5,0.5,0.5,1,0.5,0.5,0.5,0.5,1,0.5,0.5,0.5,1.5];
  let t = audioCtx.currentTime + 0.2;
  function melody() {
    let time = t;
    notes.forEach((freq,i) => {
      const osc = audioCtx.createOscillator(), env = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.value = freq;
      env.gain.setValueAtTime(0,time); env.gain.linearRampToValueAtTime(0.38,time+0.05); env.gain.exponentialRampToValueAtTime(0.001,time+durs[i]);
      osc.connect(env); env.connect(conv); osc.start(time); osc.stop(time+durs[i]+0.1);
      time += durs[i];
    }); t = time + 0.5;
  }
  const pads = [[261.63,329.63,392],[293.66,369.99,440],[246.94,311.13,369.99],[220,277.18,329.63]];
  let pi = 0;
  function pad() {
    pads[pi++%pads.length].forEach(freq => {
      const osc = audioCtx.createOscillator(), env = audioCtx.createGain(), fil = audioCtx.createBiquadFilter();
      osc.type='sawtooth'; osc.frequency.value=freq; fil.type='lowpass'; fil.frequency.value=780; fil.Q.value=2;
      env.gain.setValueAtTime(0,audioCtx.currentTime); env.gain.linearRampToValueAtTime(0.12,audioCtx.currentTime+1); env.gain.linearRampToValueAtTime(0.07,audioCtx.currentTime+2.5); env.gain.linearRampToValueAtTime(0,audioCtx.currentTime+3.5);
      osc.connect(fil); fil.connect(env); env.connect(conv); osc.start(); osc.stop(audioCtx.currentTime+4);
    });
  }
  melody(); pad();
  return { m: setInterval(melody, 12000), p: setInterval(pad, 3500) };
}

function startAudio() {
  if (isPlaying || audioCtx) return;
  intervals = createRomanticSound(); isPlaying = true; soundBtn.textContent = '🎶';
}
function stopAudio() {
  if (!isPlaying) return;
  clearInterval(intervals.m); clearInterval(intervals.p);
  gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.6);
  setTimeout(() => { audioCtx.close(); audioCtx = null; }, 700);
  isPlaying = false; soundBtn.textContent = '🎵';
}

soundBtn.addEventListener('click', e => { e.stopPropagation(); isPlaying ? stopAudio() : startAudio(); });
document.addEventListener('click',    startAudio, { once: true });
document.addEventListener('touchend', startAudio, { once: true, passive: true });
</script>
</body>
</html>
