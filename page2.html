<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Happy Birthday 🎂💜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Gaegu:wght@300;400;700&family=Poor+Story&display=swap" rel="stylesheet">
<style>
:root {
  --purple-deep:   #2d1060;
  --purple-mid:    #7c3fbf;
  --purple-light:  #b48dd4;
  --purple-pale:   #e8d5f5;
  --lavender:      #c9a8e8;
  --white:         #ffffff;
  --card-bg:       rgba(30,8,55,0.55);
}

* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; min-height:100vh; overflow-x:hidden; font-family:'Gaegu',cursive; }

/* ── Cursor ── */
@media(hover:none){ body{cursor:auto;} .cursor,.cursor-trail{display:none!important;} }
@media(hover:hover){ body{cursor:none;} }
.cursor{position:fixed;width:22px;height:22px;background:radial-gradient(circle,#e8d5f5,#b48dd4);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);box-shadow:0 0 12px #c9a8e8,0 0 24px #ede0f8;}
.cursor-trail{position:fixed;width:9px;height:9px;background:#c9a8e8;border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);opacity:0.55;transition:left .12s ease,top .12s ease;}

/* ── Background ── */
.bg{position:fixed;inset:0;background:url('img/bg2.jpeg') center/cover no-repeat;z-index:0;filter:brightness(0.32) saturate(1.2);transform:scale(1.05);animation:bgBreath 9s ease-in-out infinite;}
@keyframes bgBreath{0%,100%{transform:scale(1.05);}50%{transform:scale(1.09);}}
.overlay{position:fixed;inset:0;background:linear-gradient(170deg,rgba(45,15,80,.65) 0%,rgba(110,60,170,.38) 45%,rgba(160,110,210,.22) 70%,rgba(45,15,80,.70) 100%);z-index:1;}

/* ── Particles ── */
.particles{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden;}
.petal{position:absolute;animation:fallPetal linear infinite;opacity:0;}
@keyframes fallPetal{0%{transform:translateY(-30px) rotate(0deg);opacity:0;}8%{opacity:.8;}92%{opacity:.5;}100%{transform:translateY(110vh) rotate(720deg) translateX(50px);opacity:0;}}

/* ── Glitter canvas ── */
.glitter-canvas{position:fixed;inset:0;z-index:3;pointer-events:none;}

/* ── Page scroll container ── */
.page{position:relative;z-index:10;width:100%;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:50px 20px 80px;gap:0;}

/* ── Title ── */
.page-title{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:clamp(1.6rem,5vw,3rem);color:#fff;text-shadow:0 0 20px rgba(210,170,255,1),0 0 50px rgba(170,120,230,.9),0 2px 8px rgba(0,0,0,.8);margin-bottom:8px;text-align:center;animation:fadeInDown .8s ease .2s both;}
.page-sub{font-size:clamp(.95rem,3vw,1.2rem);color:#e8d5ff;text-shadow:0 1px 8px rgba(0,0,0,.8);margin-bottom:40px;text-align:center;animation:fadeInDown .8s ease .4s both;}
@keyframes fadeInDown{from{opacity:0;transform:translateY(-20px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}

/* ══════════════════════════════════════════
   CAKE SCENE
══════════════════════════════════════════ */
.cake-scene{
  display:flex;flex-direction:column;align-items:center;
  margin-bottom:48px;animation:fadeInUp .9s ease .6s both;
  position:relative;
}
.click-hint{
  font-size:clamp(.85rem,2.5vw,1rem);
  color:#c9a8e8;letter-spacing:1px;
  margin-bottom:14px;
  animation:hintPulse 2s ease-in-out infinite;
}
@keyframes hintPulse{0%,100%{opacity:.5;}50%{opacity:1;}}

/* ── Cake SVG wrapper ── */
.cake-wrap{position:relative;width:200px;height:220px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.cake-wrap:hover .cake-body{filter:brightness(1.08);}

/* cake body */
.cake-body{transition:filter .2s;}

/* flame container */
.flame-wrap{
  position:absolute;
  top:-42px;left:50%;transform:translateX(-50%);
  width:36px;height:56px;
  cursor:pointer;
  animation:candleSway 3s ease-in-out infinite;
}
@keyframes candleSway{0%,100%{transform:translateX(-50%) rotate(-2deg);}50%{transform:translateX(-50%) rotate(2deg);}}

/* candle stick */
.candle-stick{
  position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:10px;height:28px;
  background:linear-gradient(180deg,#d4a8ff,#9b59c4);
  border-radius:3px 3px 1px 1px;
}
/* flame */
.flame{
  position:absolute;bottom:26px;left:50%;transform:translateX(-50%);
  width:18px;height:28px;
  cursor:pointer;
}
.flame-inner{
  position:absolute;
  bottom:0;left:50%;transform:translateX(-50%);
  width:14px;height:22px;
  background:radial-gradient(ellipse 60% 100% at 50% 100%,#fff9c4 0%,#ffe082 40%,#ffb300 70%,transparent 100%);
  border-radius:50% 50% 30% 30%;
  animation:flameFlicker 0.15s ease-in-out infinite alternate;
  filter:blur(.3px);
}
.flame-outer{
  position:absolute;
  bottom:0;left:50%;transform:translateX(-50%);
  width:18px;height:28px;
  background:radial-gradient(ellipse 60% 100% at 50% 100%,rgba(255,200,50,.6) 0%,rgba(255,120,0,.4) 60%,transparent 100%);
  border-radius:50% 50% 30% 30%;
  animation:flameFlicker2 0.2s ease-in-out infinite alternate;
}
.flame-glow{
  position:absolute;
  bottom:0;left:50%;transform:translateX(-50%);
  width:30px;height:30px;
  background:radial-gradient(circle,rgba(255,200,50,.35) 0%,transparent 70%);
  animation:glowPulse 1s ease-in-out infinite;
}
@keyframes flameFlicker{0%{transform:translateX(-50%) scaleX(1) scaleY(1);}100%{transform:translateX(-50%) scaleX(.88) scaleY(1.06);}}
@keyframes flameFlicker2{0%{transform:translateX(-50%) scaleX(1) scaleY(1) rotate(-2deg);}100%{transform:translateX(-50%) scaleX(.92) scaleY(1.08) rotate(2deg);}}
@keyframes glowPulse{0%,100%{opacity:.6;}50%{opacity:1;}}

/* flame extinguished */
.flame.off .flame-inner,.flame.off .flame-outer,.flame.off .flame-glow{display:none;}
.smoke{
  display:none;
  position:absolute;bottom:26px;left:50%;transform:translateX(-50%);
  width:4px;height:20px;
  background:linear-gradient(to top,rgba(200,180,230,.8),transparent);
  border-radius:2px;
  animation:smokeRise 1.5s ease-out forwards;
}
.flame.off~.candle-stick .smoke,.flame.off+.smoke{display:block;}
@keyframes smokeRise{0%{transform:translateX(-50%) scaleY(1);opacity:.8;}100%{transform:translateX(-50%) scaleY(3) translateY(-20px);opacity:0;}}

/* ── Relight button ── */
.relight-btn{
  margin-top:18px;
  padding:10px 28px;
  background:rgba(30,8,55,.6);
  border:1.5px solid rgba(196,160,240,.5);
  border-radius:50px;
  color:#e8d5ff;
  font-family:'Gaegu',cursive;
  font-size:1rem;
  letter-spacing:1px;
  cursor:pointer;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:background .2s,transform .2s,box-shadow .2s;
  animation:fadeInUp .5s ease both;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.relight-btn:hover{
  background:rgba(138,79,192,.45);
  transform:translateY(-3px);
  box-shadow:0 6px 20px rgba(150,80,255,.3);
}
.relight-btn:active{ transform:translateY(-1px); }

/* ══════════════════════════════════════════
   CHRONOLOGY POPUP OVERLAY
══════════════════════════════════════════ */
.popup-overlay{
  position:fixed;inset:0;z-index:1000;
  display:flex;align-items:center;justify-content:center;
  background:rgba(20,5,40,.75);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  opacity:0;pointer-events:none;
  transition:opacity .4s ease;
}
.popup-overlay.open{opacity:1;pointer-events:all;}

.popup-box{
  position:relative;
  width:min(520px,94vw);
  max-height:88vh;
  background:rgba(30,8,55,.92);
  border:1.5px solid rgba(196,160,240,.35);
  border-radius:28px;
  box-shadow:0 20px 70px rgba(110,60,180,.5),0 4px 20px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08);
  overflow:hidden;
  display:flex;flex-direction:column;
  transform:scale(.88) translateY(30px);
  transition:transform .4s cubic-bezier(.34,1.56,.64,1);
}
.popup-overlay.open .popup-box{transform:scale(1) translateY(0);}

/* close btn */
.popup-close{
  position:absolute;top:14px;right:16px;z-index:10;
  background:rgba(196,160,240,.18);border:1px solid rgba(196,160,240,.4);
  border-radius:50%;width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  color:#e8d5ff;font-size:18px;cursor:pointer;
  transition:background .2s,transform .2s;
  -webkit-tap-highlight-color:transparent;
}
.popup-close:hover{background:rgba(196,160,240,.35);transform:scale(1.1);}

/* popup header */
.popup-header{
  padding:26px 24px 20px;
  border-bottom:1px solid rgba(196,160,240,.2);
  text-align:center;flex-shrink:0;
}
.popup-header h2{
  font-family:'Nanum Myeongjo',serif;font-weight:800;
  font-size:clamp(1.3rem,4vw,1.9rem);
  color:#fff;
  text-shadow:0 0 18px rgba(210,170,255,.9),0 2px 8px rgba(0,0,0,.7);
}
.popup-header p{font-size:.95rem;color:#c9a8e8;margin-top:6px;}

/* scroll area */
.popup-scroll{
  overflow-y:auto;padding:20px 20px 28px;
  flex:1;
  scrollbar-width:thin;scrollbar-color:rgba(196,160,240,.4) transparent;
}
.popup-scroll::-webkit-scrollbar{width:5px;}
.popup-scroll::-webkit-scrollbar-track{background:transparent;}
.popup-scroll::-webkit-scrollbar-thumb{background:rgba(196,160,240,.4);border-radius:10px;}

/* era blocks */
.era-block{
  background:rgba(60,20,100,.45);
  border:1px solid rgba(196,160,240,.22);
  border-radius:18px;
  padding:20px 18px 18px;
  margin-bottom:18px;
  animation:eraFadeIn .5s ease both;
}
.era-block:last-child{margin-bottom:0;}
@keyframes eraFadeIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

.era-title{
  font-family:'Nanum Myeongjo',serif;font-weight:700;
  font-size:clamp(1rem,3.5vw,1.2rem);
  color:#e8d5ff;
  margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
}
.era-title .era-icon{font-size:1.3em;}

/* photo grid */
.photo-grid{
  display:grid;gap:8px;
  grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
}
.photo-grid.single{grid-template-columns:1fr;}
.photo-grid.two{grid-template-columns:1fr 1fr;}

.photo-item{
  position:relative;border-radius:12px;overflow:hidden;
  aspect-ratio:3/4;
  background:rgba(60,20,100,.5);
  border:1.5px solid rgba(196,160,240,.2);
  cursor:pointer;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s ease;
}
.photo-item img{
  width:100%;height:100%;object-fit:cover;object-position:top center;
  display:block;transition:transform .3s ease;
}
.photo-item:hover{transform:scale(1.04);box-shadow:0 8px 30px rgba(150,80,255,.4);}
.photo-item:hover img{transform:scale(1.05);}
.photo-item .photo-shimmer{
  position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.15) 0%,transparent 60%);
  border-radius:inherit;pointer-events:none;
}

/* placeholder when image not found */
.photo-item .photo-placeholder{
  width:100%;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;
  color:rgba(196,160,240,.5);font-size:.75rem;text-align:center;padding:8px;
}
.photo-item .photo-placeholder span{font-size:1.8rem;}

/* ── Lightbox ── */
.lightbox{
  position:fixed;inset:0;z-index:2000;
  background:rgba(10,0,25,.9);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .3s ease;
}
.lightbox.open{opacity:1;pointer-events:all;}
.lightbox img{
  max-width:90vw;max-height:85vh;
  border-radius:16px;
  box-shadow:0 0 60px rgba(180,100,255,.4);
  transform:scale(.9);transition:transform .35s cubic-bezier(.34,1.56,.64,1);
  object-fit:contain;
}
.lightbox.open img{transform:scale(1);}
.lightbox-close{
  position:absolute;top:20px;right:22px;
  color:#e8d5ff;font-size:32px;cursor:pointer;
  background:rgba(60,20,100,.6);border-radius:50%;
  width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  transition:background .2s;
}
.lightbox-close:hover{background:rgba(130,60,200,.6);}

/* ══════════════════════════════════════════
   BIRTHDAY CONFETTI (triggered on flame click)
══════════════════════════════════════════ */
.confetti-piece{
  position:fixed;pointer-events:none;z-index:1500;
  width:8px;height:8px;border-radius:2px;
  animation:confettiFall linear forwards;
}
@keyframes confettiFall{
  0%{transform:translateY(-10px) rotate(0deg);opacity:1;}
  100%{transform:translateY(100vh) rotate(720deg);opacity:0;}
}

/* ── Nav ── */
.nav-bar{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  display:flex;gap:12px;z-index:100;
  background:rgba(30,8,55,.6);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(196,160,240,.3);
  border-radius:50px;padding:10px 20px;
}
.nav-btn{
  padding:8px 20px;border-radius:50px;text-decoration:none;
  font-family:'Nanum Myeongjo',serif;font-weight:700;font-size:.9rem;
  color:#e8d5ff;border:1px solid rgba(196,160,240,.35);
  background:transparent;cursor:pointer;
  transition:background .2s,transform .2s;
  -webkit-tap-highlight-color:transparent;white-space:nowrap;
}
.nav-btn:hover{background:rgba(180,141,212,.25);transform:translateY(-2px);}
.nav-btn.primary{background:linear-gradient(135deg,#b48dd4,#7c3fbf);border-color:transparent;color:#fff;}
.nav-btn.primary:hover{background:linear-gradient(135deg,#c9a8e8,#8a4fc0);}

/* ── Sound btn ── */
.sound-btn{
  position:fixed;bottom:20px;right:20px;z-index:100;
  background:rgba(30,8,55,.6);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1.5px solid rgba(196,160,240,.5);
  border-radius:50%;width:50px;height:50px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:22px;
  transition:transform .2s,background .2s;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.sound-btn:hover{transform:scale(1.12);background:rgba(138,79,192,.5);}

/* Ripple */
.ripple{position:fixed;border-radius:50%;border:2px solid rgba(196,160,240,.85);transform:scale(0);animation:rippleOut .7s ease-out forwards;pointer-events:none;z-index:9997;}
@keyframes rippleOut{to{transform:scale(7);opacity:0;}}

/* scrollbar global */
::-webkit-scrollbar{width:0;}
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="cursor-trail" id="cursorTrail"></div>

<div class="bg"></div>
<div class="overlay"></div>
<canvas class="glitter-canvas" id="glitterCanvas"></canvas>
<div class="particles" id="particles"></div>

<!-- ══ PAGE ══ -->
<div class="page">

  <div class="page-title">생일 축하해요 🎂💜</div>
  <div class="page-sub">Click the candle flame to open your memory book~</div>

  <!-- ════ CAKE ════ -->
  <div class="cake-scene">
    <div class="click-hint">✨ tap the flame ✨</div>

    <div class="cake-wrap" id="cakeWrap">
      <!-- SVG Cake -->
      <svg class="cake-body" viewBox="0 0 200 200" width="200" height="200" xmlns="http://www.w3.org/2000/svg">
        <!-- plate -->
        <ellipse cx="100" cy="185" rx="90" ry="10" fill="rgba(180,141,212,0.25)"/>
        <!-- bottom tier -->
        <rect x="20" y="120" width="160" height="65" rx="14" fill="#7c3fbf"/>
        <rect x="20" y="120" width="160" height="20" rx="10" fill="#9b59c4"/>
        <!-- bottom tier frosting drips -->
        <ellipse cx="42" cy="120" rx="10" ry="7" fill="#e8d5f5"/>
        <ellipse cx="70" cy="122" rx="9" ry="6" fill="#e8d5f5"/>
        <ellipse cx="98" cy="120" rx="10" ry="7" fill="#e8d5f5"/>
        <ellipse cx="128" cy="122" rx="9" ry="6" fill="#e8d5f5"/>
        <ellipse cx="158" cy="120" rx="10" ry="7" fill="#e8d5f5"/>
        <!-- bottom decorations -->
        <circle cx="55" cy="150" r="5" fill="#c9a8e8" opacity=".7"/>
        <circle cx="100" cy="155" r="6" fill="#b48dd4" opacity=".8"/>
        <circle cx="145" cy="150" r="5" fill="#c9a8e8" opacity=".7"/>
        <text x="100" y="160" text-anchor="middle" font-size="20" fill="rgba(255,255,255,0.3)">💜</text>
        <!-- middle tier -->
        <rect x="38" y="65" width="124" height="60" rx="12" fill="#8a4fc0"/>
        <rect x="38" y="65" width="124" height="18" rx="9" fill="#a662d4"/>
        <!-- middle frosting drips -->
        <ellipse cx="56" cy="65" rx="9" ry="6" fill="#ede0f8"/>
        <ellipse cx="82" cy="67" rx="8" ry="5" fill="#ede0f8"/>
        <ellipse cx="108" cy="65" rx="9" ry="6" fill="#ede0f8"/>
        <ellipse cx="134" cy="67" rx="8" ry="5" fill="#ede0f8"/>
        <ellipse cx="152" cy="65" rx="8" ry="5" fill="#ede0f8"/>
        <!-- middle decorations -->
        <circle cx="70" cy="90" r="4" fill="#e0c4f5" opacity=".8"/>
        <circle cx="100" cy="94" r="5" fill="#d4a8ff" opacity=".8"/>
        <circle cx="130" cy="90" r="4" fill="#e0c4f5" opacity=".8"/>
        <!-- top tier -->
        <rect x="60" y="22" width="80" height="48" rx="10" fill="#9b59c4"/>
        <rect x="60" y="22" width="80" height="16" rx="8" fill="#b06ed4"/>
        <!-- top frosting drips -->
        <ellipse cx="73" cy="22" rx="7" ry="5" fill="#f5eaff"/>
        <ellipse cx="93" cy="24" rx="7" ry="4" fill="#f5eaff"/>
        <ellipse cx="115" cy="22" rx="7" ry="5" fill="#f5eaff"/>
        <ellipse cx="135" cy="24" rx="7" ry="4" fill="#f5eaff"/>
        <!-- stars -->
        <text x="100" y="50" text-anchor="middle" font-size="14" fill="rgba(255,255,255,0.5)">✨</text>
      </svg>

      <!-- Candle & flame on top -->
      <div class="flame-wrap" id="flameWrap">
        <div class="flame" id="flame">
          <div class="flame-glow"></div>
          <div class="flame-outer"></div>
          <div class="flame-inner"></div>
        </div>
        <div class="candle-stick"></div>
      </div>
    </div>

    <!-- Reset button — shown after flame is blown -->
    <button class="relight-btn" id="relightBtn" style="display:none;">
      🕯️ Relight candle
    </button>
  </div>

</div><!-- /page -->

<!-- ════ CHRONOLOGY POPUP ════ -->
<div class="popup-overlay" id="popupOverlay">
  <div class="popup-box">
    <button class="popup-close" id="popupClose">✕</button>

    <div class="popup-header">
      <h2>💜 Memory Book 💜</h2>
      <p>Scroll through the eras~</p>
    </div>

    <div class="popup-scroll" id="popupScroll">

      <!-- Era 1 -->
      <div class="era-block" style="animation-delay:.05s">
        <div class="era-title"><span class="era-icon">🏫</span> High school era</div>
        <div class="photo-grid two" id="grid-1">
          <div class="photo-item" data-src="img/1.jpeg"><img src="img/1.jpeg" alt="High school 1" onerror="this.parentElement.innerHTML='<div class=\'photo-placeholder\'><span>🌸</span>1.jpeg</div>'"><div class="photo-shimmer"></div></div>
          <div class="photo-item" data-src="img/2.jpeg"><img src="img/2.jpeg" alt="High school 2" onerror="this.parentElement.innerHTML='<div class=\'photo-placeholder\'><span>🌸</span>2.jpeg</div>'"><div class="photo-shimmer"></div></div>
        </div>
      </div>

      <!-- Era 2 -->
      <div class="era-block" style="animation-delay:.12s">
        <div class="era-title"><span class="era-icon">📚</span> Form 6 era</div>
        <div class="photo-grid single" id="grid-2">
          <div class="photo-item" data-src="img/4.jpeg"><img src="img/4.jpeg" alt="Form 6" onerror="this.parentElement.innerHTML='<div class=\'photo-placeholder\'><span>📖</span>4.jpeg</div>'"><div class="photo-shimmer"></div></div>
        </div>
      </div>

      <!-- Era 3 -->
      <div class="era-block" style="animation-delay:.19s">
        <div class="era-title"><span class="era-icon">🌷</span> After Form 6 era</div>
        <div class="photo-grid single" id="grid-3">
          <div class="photo-item" data-src="img/3.jpeg"><img src="img/3.jpeg" alt="After Form 6" onerror="this.parentElement.innerHTML='<div class=\'photo-placeholder\'><span>🌷</span>3.jpeg</div>'"><div class="photo-shimmer"></div></div>
        </div>
      </div>

      <!-- Era 4 -->
      <div class="era-block" style="animation-delay:.26s">
        <div class="era-title"><span class="era-icon">🎓</span> Uni era</div>

<!-- ── Background audio ── -->
<audio id="bgAudio" loop preload="auto">
  <source src="audio/1.mpeg" type="audio/mpeg">
</audio>

<script>
// ── Cursor ──────────────────────────────────────────────
const cursor = document.getElementById('cursor');
const trail  = document.getElementById('cursorTrail');
const isTouch = window.matchMedia('(hover: none)').matches;
if (!isTouch) {
  document.addEventListener('mousemove', e => {
    cursor.style.left = e.clientX + 'px'; cursor.style.top = e.clientY + 'px';
    setTimeout(() => { trail.style.left = e.clientX+'px'; trail.style.top = e.clientY+'px'; }, 90);
  });
}

// ── Ripple ──────────────────────────────────────────────
document.addEventListener('click', e => {
  const r = document.createElement('div'); r.className='ripple';
  r.style.cssText=`left:${e.clientX-20}px;top:${e.clientY-20}px;width:40px;height:40px`;
  document.body.appendChild(r); setTimeout(()=>r.remove(),750);
});

// ── Glitter canvas ───────────────────────────────────────
const canvas = document.getElementById('glitterCanvas');
const ctx    = canvas.getContext('2d');
function resize(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
resize(); window.addEventListener('resize',resize);
const sparkles = Array.from({length:50},()=>({
  x:Math.random()*canvas.width, y:Math.random()*canvas.height,
  r:1+Math.random()*2.5, a:Math.random()*Math.PI*2,
  op:Math.random(), dir:(0.01+Math.random()*.04)*(Math.random()<.5?1:-1),
  color:['#c9a8e8','#b48dd4','#e8d5f5','#ffffff','#d4b8f0'][Math.floor(Math.random()*5)]
}));
function drawSparkles(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  sparkles.forEach(s=>{
    s.op+=s.dir; if(s.op>1||s.op<0)s.dir*=-1;
    ctx.save(); ctx.globalAlpha=Math.max(0,Math.min(1,s.op));
    ctx.fillStyle=s.color; ctx.shadowBlur=10; ctx.shadowColor=s.color;
    ctx.beginPath(); const r=s.r,ir=r*.38;
    for(let i=0;i<8;i++){const ang=(i*Math.PI)/4+s.a,rad=i%2===0?r:ir;
      i===0?ctx.moveTo(s.x+rad*Math.cos(ang),s.y+rad*Math.sin(ang)):ctx.lineTo(s.x+rad*Math.cos(ang),s.y+rad*Math.sin(ang));}
    ctx.closePath(); ctx.fill(); ctx.restore();
    s.a+=.012; s.x+=Math.sin(s.a)*.25; s.y+=.18;
    if(s.y>canvas.height){s.y=0;s.x=Math.random()*canvas.width;}
  });
  requestAnimationFrame(drawSparkles);
}
drawSparkles();

// ── Falling petals ───────────────────────────────────────
const particles = document.getElementById('particles');
const emojiSet  = ['🌸','💜','✨','💕','⭐','🎀','💫'];
function spawnPetal(){
  const p=document.createElement('div'); p.className='petal';
  p.textContent=emojiSet[Math.floor(Math.random()*emojiSet.length)];
  const dur=7+Math.random()*8,del=Math.random()*3;
  p.style.cssText=`left:${Math.random()*100}%;font-size:${12+Math.random()*14}px;animation-duration:${dur}s;animation-delay:${del}s;`;
  particles.appendChild(p);
  setTimeout(()=>p.remove(),(dur+del)*1000+500);
}
for(let i=0;i<18;i++) spawnPetal();
setInterval(spawnPetal,800);

// ── FLAME CLICK → open popup + confetti + birthday sound ─
const flame      = document.getElementById('flame');
const overlay    = document.getElementById('popupOverlay');
const popupClose = document.getElementById('popupClose');
const relightBtn = document.getElementById('relightBtn');
let flameBlown   = false;

function blowCandle(){
  if(flameBlown) return;
  flameBlown = true;
  flame.classList.add('off');
  relightBtn.style.display = 'inline-block';
  shootConfetti();
  playBirthdaySong();
  switchToGalleryAudio();
  setTimeout(()=>{ overlay.classList.add('open'); }, 500);
}

function relightCandle(){
  flameBlown = false;
  flame.classList.remove('off');
  relightBtn.style.display = 'none';
}

relightBtn.addEventListener('click', e => { e.stopPropagation(); relightCandle(); });

flame.addEventListener('click', e => { e.stopPropagation(); blowCandle(); });
flame.addEventListener('touchend', e => { e.preventDefault(); blowCandle(); });
document.getElementById('cakeWrap').addEventListener('click', blowCandle);

popupClose.addEventListener('click', ()=>{ overlay.classList.remove('open'); });
overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.classList.remove('open'); });

// ── Confetti burst ───────────────────────────────────────
function shootConfetti(){
  const colors=['#c9a8e8','#b48dd4','#e8d5f5','#ffffff','#ffe0ff','#a88fd4','#f5c842'];
  for(let i=0;i<80;i++){
    const c=document.createElement('div'); c.className='confetti-piece';
    const x=Math.random()*window.innerWidth;
    const size=6+Math.random()*8;
    const dur=1.5+Math.random()*2;
    c.style.cssText=`left:${x}px;top:-10px;width:${size}px;height:${size}px;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${dur}s;border-radius:${Math.random()>0.5?'50%':'3px'};`;
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),(dur+.2)*1000);
  }
}

// ── Photo lightbox ───────────────────────────────────────
const lightbox     = document.getElementById('lightbox');
const lightboxImg  = document.getElementById('lightboxImg');
const lightboxClose= document.getElementById('lightboxClose');

document.querySelectorAll('.photo-item').forEach(item=>{
  item.addEventListener('click',()=>{
    const src = item.dataset.src;
    if(!src) return;
    lightboxImg.src=src;
    lightbox.classList.add('open');
  });
});
lightboxClose.addEventListener('click',()=>lightbox.classList.remove('open'));
lightbox.addEventListener('click',e=>{ if(e.target===lightbox||e.target===lightboxImg) lightbox.classList.remove('open'); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ lightbox.classList.remove('open'); overlay.classList.remove('open'); }});

// ── Audio playback ──────────────────────────────────────
const bgAudio  = document.getElementById('bgAudio');
const soundBtn = document.getElementById('soundBtn');

// Attempt autoplay immediately
bgAudio.volume = 0.75;
bgAudio.play().then(()=>{
  soundBtn.textContent='🎶';
}).catch(()=>{
  // Autoplay blocked — wait for first user interaction
  soundBtn.textContent='🎵';
});

// Toggle mute/unmute with sound button
soundBtn.addEventListener('click', e=>{
  e.stopPropagation();
  if(bgAudio.paused){
    bgAudio.play();
    soundBtn.textContent='🎶';
  } else {
    bgAudio.pause();
    soundBtn.textContent='🎵';
  }
});

// Start on first interaction if autoplay was blocked
function startAudioOnInteraction(){
  if(bgAudio.paused){
    bgAudio.play();
    soundBtn.textContent='🎶';
  }
}
document.addEventListener('click',  startAudioOnInteraction, {once:true});
document.addEventListener('touchend',startAudioOnInteraction, {once:true, passive:true});

// Switch to audio/2.mpeg when popup gallery (flame click) opens
function switchToGalleryAudio(){
  const wasPlaying = !bgAudio.paused;
  const currentTime = bgAudio.currentTime;
  bgAudio.src = 'audio/2.mpeg';
  bgAudio.load();
  if(wasPlaying){
    bgAudio.play();
    soundBtn.textContent='🎶';
  }
}

// playBirthdaySong kept for compatibility with blowCandle()
function playBirthdaySong(){ /* audio handled via bgAudio */ }
</script>
